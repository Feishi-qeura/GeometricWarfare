<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Geometric Warfare Promo Renderer</title>
<style>
  @font-face { font-family: 'GWLatin'; src: url(/fonts/Roboto-Black.ttf); font-weight: 900; }
  @font-face { font-family: 'GWLatin'; src: url(/fonts/Roboto-Bold.ttf); font-weight: 700; }
  @font-face { font-family: 'GWLatin'; src: url(/fonts/Roboto-Medium.ttf); font-weight: 500; }
  @font-face { font-family: 'GWCJK'; src: url(/fonts/NotoSansSC-VF.ttf); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: #1F2633; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 10px; padding: 8px 12px; background: rgba(31,38,51,0.85); color: #F6F0E1; font: 14px sans-serif; align-items: center; }
  #bar input[type=range] { flex: 1; }
  body.preview canvas { width: 100vw; height: auto; }
  body.preview #bar { display: flex; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="bar">
  <input id="seek" type="range" min="0" max="81.4" step="0.0333" value="0">
  <span id="time">0.00</span>
</div>
<script type="module" src="/src/renderer.mjs"></script>
</body>
</html>
